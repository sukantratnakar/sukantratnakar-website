<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Books - Published works on business, strategy, and leadership by Sukant Ratnakar.">
  <title>Books | Sukant Ratnakar</title>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1aa;
      --accent: #6366f1;
      --border: rgba(255,255,255,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7; overflow-x: hidden; max-width: 100vw;
      
    }
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 32px; }
    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text-primary); }
    .page-header {
      padding: 140px 40px 40px;
      max-width: 800px;
      margin: 0 auto;
    }
    .breadcrumb {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }
    .breadcrumb a { color: var(--text-secondary); text-decoration: none; }
    .breadcrumb a:hover { color: var(--accent); }
    .page-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .page-header .subtitle {
      font-size: 18px;
      color: var(--text-secondary);
    }
    .page-header .meta {
      margin-top: 16px;
    }
    .page-header .meta a {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
    }
    .books-grid {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 40px 80px;
    }
    .coming-soon {
      padding: 80px 40px;
      text-align: center;
      background: rgba(255,255,255,0.02);
      border: 1px dashed var(--border);
      border-radius: 20px;
    }
    .coming-soon .icon { font-size: 64px; margin-bottom: 24px; opacity: 0.5; }
    .coming-soon h2 { font-size: 24px; margin-bottom: 12px; color: var(--text-secondary); }
    .coming-soon p { color: var(--text-secondary); opacity: 0.7; }
    .footer {
      padding: 40px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      border-top: 1px solid var(--border);
      margin-top: 80px;
    }
    .footer-links { display: flex; justify-content: center; gap: 32px; margin-bottom: 24px; }
    .footer-links a { color: var(--text-secondary); text-decoration: none; }
    .footer-links a:hover { color: var(--text-primary); }
    @media (max-width: 768px) {
      .nav { padding: 16px 20px; }
      .page-header { padding: 100px 20px 32px; }
      .page-header h1 { font-size: 36px; }
      .books-grid { padding: 0 20px 60px; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-logo">SR</a>
    <div class="nav-links">
      <a href="/#about">About</a>
      <a href="/explore" class="active">Explore</a>
      <a href="https://cal.com/sukantratnakar/lets-talk" target="_blank">Book a Conversation</a>
    </div>
  </nav>

  <header class="page-header">
    <div class="breadcrumb">
      <a href="/">Home</a> / <a href="/explore">Explore</a> / Books
    </div>
    <h1>Books</h1>
    <p class="subtitle">Published works on business, strategy, and leadership</p>
    <div class="meta">
      <a href="https://systovation.com" target="_blank">View all on Systovation →</a>
    </div>
  </header>

  <div class="books-grid">
    <div class="coming-soon">
      <div class="icon">📚</div>
      <h2>Coming Soon</h2>
      <p>Books and published works will be featured here.</p>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-links">
      <a href="/explore">← Back to Explore</a>
      <a href="/explore/diary">Diary</a>
      <a href="/explore/podcast">Podcast</a>
      <a href="/explore/papers">Papers</a>
    </div>
    <p>© 2026 Sukant Ratnakar</p>
  </footer>
</body>
</html>
