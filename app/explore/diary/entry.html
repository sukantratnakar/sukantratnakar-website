<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Diary entry by Sukant Ratnakar">
  <meta property="og:type" content="article">
  <title>Diary | Sukant Ratnakar</title>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1aa;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --border: rgba(255,255,255,0.1);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.8;
      
    }
    
    /* Navigation */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    
    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
    }
    
    .nav-links {
      display: flex;
      gap: 32px;
      align-items: center;
    }
    
    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }
    
    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text-primary);
    }
    
    .hamburger {
      display: none;
      flex-direction: column;
      width: 40px;
      height: 40px;
      cursor: pointer;
      background: none;
      border: none;
      justify-content: center;
      align-items: center;
    }
    
    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--text-primary);
      margin: 3px 0;
      transition: all 0.3s;
    }
    
    /* Article */
    .article {
      max-width: 720px;
      margin: 0 auto;
      padding: 140px 40px 80px;
    }
    
    .breadcrumb {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }
    
    .breadcrumb a {
      color: var(--text-secondary);
      text-decoration: none;
    }
    
    .breadcrumb a:hover {
      color: var(--accent);
    }
    
    .article-date {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .linkedin-badge {
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
    }
    
    .linkedin-badge:hover {
      background: rgba(99, 102, 241, 0.25);
    }
    
    .article h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 500;
      line-height: 1.3;
      margin-bottom: 32px;
    }
    
    .article-content {
      font-size: 18px;
      color: var(--text-primary);
    }
    
    .article-content p {
      margin-bottom: 24px;
    }
    
    .article-content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 24px;
      margin: 32px 0;
      font-style: italic;
      color: var(--text-secondary);
    }
    
    .tags {
      display: flex;
      gap: 8px;
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    
    .tag {
      font-size: 13px;
      color: var(--text-secondary);
      background: rgba(255,255,255,0.05);
      padding: 6px 14px;
      border-radius: 16px;
      text-decoration: none;
    }
    
    .tag:hover {
      background: rgba(255,255,255,0.1);
    }
    
    /* Navigation */
    .article-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 60px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
    }
    
    .article-nav a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }
    
    .article-nav a:hover {
      color: var(--accent);
    }
    
    /* Footer */
    .footer {
      padding: 40px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      border-top: 1px solid var(--border);
    }
    
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    
    .footer-links a {
      color: var(--text-secondary);
      text-decoration: none;
    }
    
    .footer-links a:hover {
      color: var(--text-primary);
    }
    
    /* Mobile */
    @media (max-width: 768px) {
      .nav { padding: 16px 20px; }
      .nav-links { display: none; }
      .hamburger { display: flex; }
      
      .article {
        padding: 100px 20px 60px;
      }
      
      .article h1 {
        font-size: 32px;
      }
      
      .article-content {
        font-size: 17px;
      }
    }
    
    .page-content {
      animation: fadeIn 0.5s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .mobile-menu {
      display: none;
      position: fixed;
      top: 65px;
      left: 0;
      right: 0;
      background: rgba(10, 10, 15, 0.98);
      padding: 20px;
      z-index: 99;
    }
    
    .mobile-menu.active { display: block; }
    
    .mobile-menu a {
      display: block;
      padding: 16px 0;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 18px;
      border-bottom: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-logo">SR</a>
    <div class="nav-links">
      <a href="/#about">About</a>
      <a href="/explore" class="active">Explore</a>
      <a href="https://cal.com/sukantratnakar/lets-talk" target="_blank">Book a Conversation</a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>
  
  <div class="mobile-menu" id="mobile-menu">
    <a href="/#about">About</a>
    <a href="/explore">Explore</a>
    <a href="https://cal.com/sukantratnakar/lets-talk" target="_blank">Book a Conversation</a>
  </div>

  <div class="page-content">
    <article class="article" id="article">
      <div class="breadcrumb">
        <a href="/">Home</a> / <a href="/explore">Explore</a> / <a href="/explore/diary">Diary</a>
      </div>
      <p style="color: var(--text-secondary);">Loading...</p>
    </article>
  </div>

  <footer class="footer">
    <div class="footer-links">
      <a href="/explore/diary">← All Diary Entries</a>
      <a href="/explore">Explore</a>
    </div>
    <p>© 2026 Sukant Ratnakar</p>
  </footer>

  <script>
    const CONTENT_API = 'https://sukantratnakar-api.sukantratnakar.workers.dev/api/content';
    
    async function loadEntry() {
      // Get entry ID from URL: /explore/diary/entry.html?id=xxx or /explore/diary/xxx.html
      const urlParams = new URLSearchParams(window.location.search);
      let entryId = urlParams.get('id');
      
      // Or extract from path
      if (!entryId) {
        const path = window.location.pathname;
        const match = path.match(/\/diary\/([^/]+)\.html$/);
        if (match) entryId = match[1];
      }
      
      if (!entryId || entryId === 'entry' || entryId === 'index') {
        document.getElementById('article').innerHTML = '<p style="color:var(--text-secondary);">Entry not found. <a href="/explore/diary" style="color:var(--accent);">View all entries →</a></p>';
        return;
      }
      
      try {
        // Try API first
        const response = await fetch(`${CONTENT_API}?type=diary`);
        if (response.ok) {
          const entries = await response.json();
          const entry = entries.find(e => e.id === entryId);
          if (entry) {
            renderEntry(entry, entries);
            return;
          }
        }
      } catch (e) {}
      
      // Fallback to local
      try {
        const response = await fetch('/data/diary.json');
        const entries = await response.json();
        const entry = entries.find(e => e.id === entryId);
        if (entry) {
          renderEntry(entry, entries);
        } else {
          document.getElementById('article').innerHTML = '<p style="color:var(--text-secondary);">Entry not found. <a href="/explore/diary" style="color:var(--accent);">View all entries →</a></p>';
        }
      } catch (e) {
        document.getElementById('article').innerHTML = '<p style="color:var(--text-secondary);">Could not load entry.</p>';
      }
    }
    
    function renderEntry(entry, allEntries) {
      document.title = `${entry.title || 'Diary'} | Sukant Ratnakar`;
      
      // Update meta
      const desc = document.querySelector('meta[name="description"]');
      if (desc) desc.content = entry.excerpt || entry.text;
      
      // Find prev/next
      allEntries.sort((a, b) => new Date(b.date) - new Date(a.date));
      const currentIndex = allEntries.findIndex(e => e.id === entry.id);
      const prev = allEntries[currentIndex + 1];
      const next = allEntries[currentIndex - 1];
      
      // Convert fullText to paragraphs
      const content = (entry.fullText || entry.text)
        .split('\n\n')
        .filter(p => p.trim())
        .map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`)
        .join('');
      
      document.getElementById('article').innerHTML = `
        <div class="breadcrumb">
          <a href="/">Home</a> / <a href="/explore">Explore</a> / <a href="/explore/diary">Diary</a>
        </div>
        
        <div class="article-date">
          ${new Date(entry.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}
          ${entry.linkedinUrl ? `<a href="${entry.linkedinUrl}" target="_blank" class="linkedin-badge">View on LinkedIn →</a>` : ''}
        </div>
        
        <h1>${entry.title || 'Untitled'}</h1>
        
        <div class="article-content">
          ${content}
        </div>
        
        ${entry.tags && entry.tags.length ? `
          <div class="tags">
            ${entry.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
          </div>
        ` : ''}
        
        <div class="article-nav">
          ${prev ? `<a href="/explore/diary/${prev.id}.html">← ${prev.title || 'Previous'}</a>` : '<span></span>'}
          ${next ? `<a href="/explore/diary/${next.id}.html">${next.title || 'Next'} →</a>` : '<span></span>'}
        </div>
      `;
    }
    
    loadEntry();
    
    // Mobile menu
    document.getElementById('hamburger').addEventListener('click', () => {
      document.getElementById('hamburger').classList.toggle('active');
      document.getElementById('mobile-menu').classList.toggle('active');
    });
  </script>
</body>
</html>
