<html lang="en">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1aa;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --border: rgba(255,255,255,0.1);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; overflow-x: hidden; width: 100%; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
    }
    
    /* Navigation */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    
    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
    }
    
    .nav-links { display: flex; gap: 24px; }
    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text-primary); }
    .nav-links a.active { color: var(--accent); }
    
    .hamburger {
      display: none;
      flex-direction: column;
      width: 40px;
      height: 40px;
      cursor: pointer;
      background: none;
      border: none;
      justify-content: center;
      align-items: center;
    }
    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--text-primary);
      margin: 3px 0;
      transition: all 0.3s;
    }
    .mobile-menu {
      display: none;
      position: fixed;
      top: 65px;
      left: 0;
      right: 0;
      background: rgba(10, 10, 15, 0.98);
      padding: 20px;
      z-index: 99;
    }
    .mobile-menu.active { display: block; }
    .mobile-menu a {
      display: block;
      padding: 16px 0;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 18px;
      border-bottom: 1px solid var(--border);
    }
    
    /* Breadcrumb */
    .breadcrumb {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }
    .breadcrumb a {
      color: var(--text-secondary);
      text-decoration: none;
    }
    .breadcrumb a:hover {
      color: var(--accent);
    }
    
    /* Main Container */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 120px 24px 100px;
    }
    
    /* Header */
    .page-header {
      text-align: center;
      margin-bottom: 60px;
    }
    
    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 500;
      margin-bottom: 12px;
    }
    
    .page-subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 400px;
      margin: 0 auto;
    }
    
    /* Quote of the Day */
    .quote-of-day {
      background: linear-gradient(135deg, var(--bg-card) 0%, rgba(99, 102, 241, 0.05) 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 56px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .quote-of-day::before {
      content: '"';
      position: absolute;
      top: -30px;
      left: 20px;
      font-size: 180px;
      font-family: 'Playfair Display', serif;
      color: rgba(99, 102, 241, 0.06);
      line-height: 1;
    }
    
    .quote-date {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }
    
    .quote-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 500;
      line-height: 1.6;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }
    
    .quote-author {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }
    
    .quote-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 80px;
      margin-bottom: 56px;
    }
    
    .quote-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .quote-btn:hover {
      background: rgba(255,255,255,0.05);
      color: var(--text-primary);
      border-color: rgba(255,255,255,0.2);
    }
    
    /* Hidden canvas for poster generation */
    #poster-canvas { display: none; }
    
    /* Category Filters */
    .category-filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 48px;
    }
    
    .filter-btn {
      padding: 10px 20px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .filter-btn:hover {
      border-color: rgba(255,255,255,0.2);
      color: var(--text-primary);
    }
    
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    
    /* Archive Section */
    .archive-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .archive-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 500;
      color: var(--text-secondary);
    }
    
    .random-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .random-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    /* Quote Grid */
    .quotes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    
    .quote-card {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      transition: all 0.2s;
      cursor: pointer;
    }
    
    .quote-card:hover {
      border-color: rgba(255,255,255,0.2);
      background: var(--bg-card);
    }
    
    .quote-card-text {
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 12px;
      color: var(--text-primary);
    }
    
    .quote-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    
    .quote-category {
      color: var(--text-secondary);
      font-size: 0.75rem;
      text-transform: capitalize;
    }
    
    /* Load More */
    .load-more {
      text-align: center;
      margin-top: 40px;
    }
    
    .load-more-btn {
      padding: 12px 32px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .load-more-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
    }
    
    /* Footer */
    .footer {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      margin-top: 60px;
    }
    
    .footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }
    
    .footer a:hover { color: var(--accent); }
    
    /* Mobile */
    @media (max-width: 640px) {
      .nav { padding: 16px 20px; }
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .container { padding: 100px 20px 80px; }
      .page-header { margin-bottom: 48px; }
      .page-title { font-size: 2rem; }
      .quote-of-day { padding: 40px 24px; }
      .quote-text { font-size: 1.3rem; }
      .quote-actions {
        margin-top: 60px;
        margin-bottom: 48px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .quote-btn { 
        padding: 12px 10px; 
        font-size: 0.8rem;
        justify-content: center;
      }
      .category-filters { margin-bottom: 40px; gap: 8px; }
      .filter-btn { padding: 8px 16px; font-size: 0.85rem; }
      .quotes-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <script>
    let allQuotes = [];
    let displayedQuotes = 0;
    let currentCategory = 'all';
    const QUOTES_PER_PAGE = 12;

    // Format today's date based on visitor's timezone
    function formatDate() {
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      return new Date().toLocaleDateString('en-US', options);
    }

    // Get quote of the day (deterministic based on date)
    function getQuoteOfDay(quotes) {
      const today = new Date();
      const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);
      const index = dayOfYear % quotes.length;
      return quotes[index];
    }

    // Load quotes from JSON
    async function loadQuotes() {
      try {
        const response = await fetch('/data/quotes.json');
        allQuotes = await response.json();
        
        // Set today's date
        document.getElementById('today-date').textContent = formatDate();
        
        // Set quote of the day
        const qotd = getQuoteOfDay(allQuotes);
        currentQuoteId = qotd.id;
        document.getElementById('qotd-text').textContent = `"${qotd.text}"`;
        
        // Update count
        document.getElementById('quote-count').textContent = `${allQuotes.length} quotes`;
        
        // Load initial grid
        displayQuotes();
      } catch (error) {
        console.error('Failed to load quotes:', error);
        document.getElementById('qotd-text').textContent = '"Wisdom begins with wonder."';
      }
    }

    // Display quotes in grid
    function displayQuotes() {
      const grid = document.getElementById('quotes-grid');
      const filtered = currentCategory === 'all' 
        ? allQuotes 
        : allQuotes.filter(q => q.category === currentCategory);
      
      const toShow = filtered.slice(displayedQuotes, displayedQuotes + QUOTES_PER_PAGE);
      
      toShow.forEach(quote => {
        const card = document.createElement('div');
        card.className = 'quote-card';
        card.innerHTML = `
          <p class="quote-card-text">"${quote.text}"</p>
          <div class="quote-card-meta">
            <span class="quote-category">${quote.category || 'wisdom'}</span>
            <button onclick="event.stopPropagation(); copyText('${quote.text.replace(/'/g, "\\'")}')">📋</button>
          </div>
        `;
        card.onclick = () => showQuoteModal(quote);
        grid.appendChild(card);
      });
      
      displayedQuotes += toShow.length;
      
      // Hide load more if no more quotes
      if (displayedQuotes >= filtered.length) {
        document.getElementById('load-more').style.display = 'none';
      } else {
        document.getElementById('load-more').style.display = 'block';
      }
    }

    // Load more quotes
    function loadMore() {
      displayQuotes();
    }

    // Filter by category
    document.getElementById('category-filters').addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-btn')) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.dataset.category;
        displayedQuotes = 0;
        document.getElementById('quotes-grid').innerHTML = '';
        displayQuotes();
      }
    });

    // Random quote
    function getRandomQuote() {
      const quote = allQuotes[Math.floor(Math.random() * allQuotes.length)];
      currentQuoteId = quote.id;
      document.getElementById('qotd-text').textContent = `"${quote.text}"`;
    }

    // Current quote for sharing
    let currentQuoteId = null;
    
    // Share on various platforms
    function shareQuote(platform) {
      if (!currentQuoteId) return;
      
      const text = document.getElementById('qotd-text').textContent;
      const quoteText = `${text} — Sukant Ratnakar`;
      const quoteUrl = `https://sukantratnakar.com/explore/quotes/${currentQuoteId}`;
      
      let shareUrl;
      switch (platform) {
        case 'twitter':
          shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(quoteText + '\n\n' + quoteUrl)}`;
          break;
        case 'linkedin':
          shareUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(quoteUrl)}`;
          break;
        case 'facebook':
          shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(quoteUrl)}`;
          break;
      }
      window.open(shareUrl, '_blank', 'width=600,height=400');
    }

    // Generate poster image
    function generatePoster(quoteText) {
      const canvas = document.getElementById('poster-canvas');
      const ctx = canvas.getContext('2d');
      const size = 1080;
      
      // Background gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#0a0a0f');
      gradient.addColorStop(1, '#1a1a24');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // Decorative quote mark
      ctx.font = '400px "Playfair Display", Georgia, serif';
      ctx.fillStyle = 'rgba(99, 102, 241, 0.08)';
      ctx.textAlign = 'left';
      ctx.fillText('"', 40, 320);
      
      // Accent line
      ctx.fillStyle = '#6366f1';
      ctx.fillRect(80, 420, 4, 240);
      
      // Quote text - wrap and center
      ctx.fillStyle = '#f5f5f7';
      ctx.textAlign = 'center';
      const cleanQuote = quoteText.replace(/^"|"$/g, '');
      
      // Determine font size based on quote length
      let fontSize = cleanQuote.length > 100 ? 48 : cleanQuote.length > 60 ? 56 : 64;
      ctx.font = `500 ${fontSize}px "Playfair Display", Georgia, serif`;
      
      // Word wrap
      const maxWidth = size - 160;
      const lineHeight = fontSize * 1.4;
      const words = cleanQuote.split(' ');
      const lines = [];
      let currentLine = '';
      
      words.forEach(word => {
        const testLine = currentLine ? currentLine + ' ' + word : word;
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth) {
          lines.push(currentLine);
          currentLine = word;
        } else {
          currentLine = testLine;
        }
      });
      if (currentLine) lines.push(currentLine);
      
      // Center vertically
      const totalHeight = lines.length * lineHeight;
      let startY = (size - totalHeight) / 2 + lineHeight / 2;
      
      lines.forEach((line, i) => {
        ctx.fillText(line, size / 2, startY + i * lineHeight);
      });
      
      // Author
      ctx.font = '32px "Inter", sans-serif';
      ctx.fillStyle = '#a1a1aa';
      ctx.fillText('— Sukant Ratnakar', size / 2, startY + lines.length * lineHeight + 60);
      
      // Website
      ctx.font = '24px "Inter", sans-serif';
      ctx.fillStyle = '#6366f1';
      ctx.fillText('sukantratnakar.com', size / 2, size - 60);
      
      return canvas;
    }

    // Download poster for Instagram/sharing
    function downloadPoster() {
      if (!currentQuoteId) return;
      
      const imageUrl = `/api/og/quote/${currentQuoteId}`;
      
      // Check if Web Share API is available (iOS Safari, Android)
      if (navigator.share && navigator.canShare) {
        // Fetch the image and share it
        fetch(imageUrl)
          .then(res => res.blob())
          .then(blob => {
            const file = new File([blob], 'sukant-ratnakar-quote.png', { type: 'image/png' });
            if (navigator.canShare({ files: [file] })) {
              navigator.share({
                files: [file],
                title: 'Quote by Sukant Ratnakar',
                text: document.getElementById('qotd-text').textContent
              }).catch(() => {
                // Fallback: open image in new tab
                window.open(imageUrl, '_blank');
              });
            } else {
              window.open(imageUrl, '_blank');
            }
          })
          .catch(() => window.open(imageUrl, '_blank'));
      } else {
        // Desktop: direct download
        const link = document.createElement('a');
        link.download = 'sukant-ratnakar-quote.png';
        link.href = imageUrl;
        link.click();
      }
    }

    // Copy quote
    function copyQuote() {
      const text = document.getElementById('qotd-text').textContent;
      copyText(text + ' — Sukant Ratnakar');
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('Quote copied to clipboard!');
      });
    }

    // Initialize
    loadQuotes();
    
    // Mobile menu
    document.getElementById('hamburger').addEventListener('click', () => {
      document.getElementById('hamburger').classList.toggle('active');
      document.getElementById('mobile-menu').classList.toggle('active');
    });
  </script>
</body>
