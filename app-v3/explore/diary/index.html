<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Observations, patterns, and ideas from the field — management lessons from everyday moments.">
  <meta property="og:title" content="Diary | Sukant Ratnakar">
  <meta property="og:description" content="Management lessons from parking lots, marketplaces, and distillery restrooms.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.sukantratnakar.com/explore/diary">
  <title>Diary | Sukant Ratnakar</title>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1aa;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --border: rgba(255,255,255,0.1);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; overflow-x: hidden; width: 100%; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      
    }
    
    /* Navigation */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    
    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
    }
    
    .nav-links { display: flex; gap: 24px; }
    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text-primary); }
    
    /* Breadcrumb */
    .breadcrumb {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }
    .breadcrumb a {
      color: var(--text-secondary);
      text-decoration: none;
    }
    .breadcrumb a:hover { color: var(--accent); }
    
    /* Main Container */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 100px 24px 80px;
    }
    
    /* Header */
    .page-header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 500;
      margin-bottom: 16px;
    }
    
    .page-subtitle {
      color: var(--text-secondary);
      font-size: 1.1rem;
      max-width: 500px;
      margin: 0 auto 24px;
    }
    
    .linkedin-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .linkedin-link:hover { color: var(--accent-hover); }
    
    /* Tag Filters */
    .tag-filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 48px;
      padding: 0 16px;
    }
    
    .tag-btn {
      padding: 8px 18px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    
    .tag-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    .tag-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    
    .tag-count {
      opacity: 0.7;
      font-size: 0.75rem;
      margin-left: 4px;
    }
    
    /* Stories Grid */
    .stories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }
    
    /* Story Card */
    .story-card {
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    
    .story-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(99, 102, 241, 0.15);
    }
    
    .story-card.hidden {
      display: none;
    }
    
    .story-image {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--bg-secondary);
    }
    
    .story-content {
      padding: 20px;
    }
    
    .story-date {
      font-size: 0.75rem;
      color: var(--accent);
      margin-bottom: 8px;
      font-weight: 500;
    }
    
    .story-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 500;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    
    .story-excerpt {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    
    .story-tags {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    
    .story-tag {
      font-size: 0.7rem;
      padding: 3px 10px;
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent);
      border-radius: 12px;
    }
    
    .story-linkedin {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    
    .story-linkedin svg {
      width: 14px;
      height: 14px;
    }
    
    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
    
    /* Footer */
    footer {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      margin-top: 60px;
    }
    
    @media (max-width: 640px) {
      .nav { padding: 12px 16px; }
      .container { padding: 80px 16px 60px; }
      .page-title { font-size: 2.2rem; }
      .stories-grid { grid-template-columns: 1fr; }
      .tag-filters { gap: 8px; }
      .tag-btn { padding: 6px 14px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-logo">SR</a>
    <div class="nav-links">
      <a href="/#about">About</a>
      <a href="/explore/" class="active">Explore</a>
      <a href="https://book.sukantratnakar.com" target="_blank">Calendar</a>
    </div>
  </nav>
  
  <main class="container">
    <div class="breadcrumb">
      <a href="/">Home</a> / <a href="/explore/">Explore</a> / Diary
    </div>
    
    <header class="page-header">
      <h1 class="page-title">Diary</h1>
      <p class="page-subtitle">Observations, patterns, and ideas from the field</p>
      <a href="https://www.linkedin.com/in/sukant" target="_blank" rel="noopener" class="linkedin-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
        Follow on LinkedIn →
      </a>
    </header>
    
    <!-- Tag Filters -->
    <div class="tag-filters" id="tagFilters">
      <button class="tag-btn active" data-tag="all">All</button>
      <!-- Tags populated by JS -->
    </div>
    
    <!-- Stories Grid -->
    <div class="stories-grid" id="storiesGrid">
      <!-- Stories populated by JS -->
    </div>
    
    <div class="empty-state" id="emptyState" style="display: none;">
      No stories found for this filter.
    </div>
  </main>
  
  <footer>
    © 2026 Sukant Ratnakar
  </footer>
  
  <script>
    const PLACEHOLDER_IMAGE = 'data:image/svg+xml,' + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
        <rect fill="#1a1a24" width="400" height="400"/>
        <text x="200" y="200" text-anchor="middle" fill="#6366f1" font-family="system-ui" font-size="48">📔</text>
      </svg>
    `);
    
    async function loadDiary() {
      try {
        const res = await fetch('/data/diary.json');
        const entries = await res.json();
        
        // Sort by date (newest first)
        entries.sort((a, b) => new Date(b.date) - new Date(a.date));
        
        // Extract all tags and count
        const tagCounts = {};
        entries.forEach(entry => {
          (entry.tags || []).forEach(tag => {
            tagCounts[tag] = (tagCounts[tag] || 0) + 1;
          });
        });
        
        // Render tag filters
        const filtersContainer = document.getElementById('tagFilters');
        const sortedTags = Object.keys(tagCounts).sort();
        sortedTags.forEach(tag => {
          const btn = document.createElement('button');
          btn.className = 'tag-btn';
          btn.dataset.tag = tag;
          btn.innerHTML = `${tag}<span class="tag-count">${tagCounts[tag]}</span>`;
          btn.onclick = () => filterByTag(tag);
          filtersContainer.appendChild(btn);
        });
        
        // Render stories
        const grid = document.getElementById('storiesGrid');
        entries.forEach(entry => {
          const card = document.createElement('a');
          card.className = 'story-card';
          card.href = entry.linkedinUrl || `${entry.id}.html`;
          card.target = entry.linkedinUrl ? '_blank' : '_self';
          card.rel = entry.linkedinUrl ? 'noopener' : '';
          card.dataset.tags = (entry.tags || []).join(',');
          
          const dateStr = new Date(entry.date).toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });
          
          card.innerHTML = `
            <img class="story-image" src="${entry.image || PLACEHOLDER_IMAGE}" alt="${entry.title}" onerror="this.src='${PLACEHOLDER_IMAGE}'">
            <div class="story-content">
              <div class="story-date">${dateStr}</div>
              <h2 class="story-title">${entry.title}</h2>
              <p class="story-excerpt">${entry.excerpt}</p>
              <div class="story-tags">
                ${(entry.tags || []).map(t => `<span class="story-tag">${t}</span>`).join('')}
              </div>
              ${entry.linkedinUrl ? `
                <div class="story-linkedin">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
                  LinkedIn
                </div>
              ` : ''}
            </div>
          `;
          
          grid.appendChild(card);
        });
        
      } catch (err) {
        console.error('Failed to load diary:', err);
      }
    }
    
    function filterByTag(tag) {
      // Update active button
      document.querySelectorAll('.tag-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tag === tag || (tag === 'all' && btn.dataset.tag === 'all'));
      });
      
      // Filter cards
      const cards = document.querySelectorAll('.story-card');
      let visibleCount = 0;
      
      cards.forEach(card => {
        const cardTags = card.dataset.tags.split(',');
        const show = tag === 'all' || cardTags.includes(tag);
        card.classList.toggle('hidden', !show);
        if (show) visibleCount++;
      });
      
      // Show empty state if no results
      document.getElementById('emptyState').style.display = visibleCount === 0 ? 'block' : 'none';
    }
    
    // Make "All" button work
    document.querySelector('[data-tag="all"]').onclick = () => filterByTag('all');
    
    // Load on page ready
    loadDiary();
  </script>
</body>
</html>
